<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1a10">
<title>Thekua</title>
<style>
:root{color-scheme:dark;--bg-top:#3a2414;--bg-bottom:#1a100a}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg-bottom)}
body{background:radial-gradient(90% 70% at 50% 45%,var(--bg-top),var(--bg-bottom))}
#stage{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
</style>
</head>
<body>
<canvas id="stage" aria-label="3D thekua. Tilt your phone or drag to turn it."></canvas>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
camera.position.set(0, 0, 5.2);

scene.add(new THREE.HemisphereLight(0xfff1dc, 0x3a2010, 1.6));
const key = new THREE.DirectionalLight(0xffe2b8, 2.2); key.position.set(-2, 3, 4); scene.add(key);
const rim = new THREE.DirectionalLight(0xffc87a, 1.4); rim.position.set(3, -1, -3); scene.add(rim);

const W = 0.68, D = 0.24;   // half-width, half-thickness (half-height = 1), from the side photos
const loader = new THREE.TextureLoader();
const tex = (url) => { const t = loader.load(url); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; };
const sideTex = tex('assets/side.png'), topTex = tex('assets/top.png');

// Triplanar blend of real photos: face photo where the surface faces the camera,
// side photo on the left/right rim, top photo on the top/bottom rim. Weights follow the
// surface normal, so face -> rim -> other face fades smoothly instead of stretching pixels.
function half(phiStart, faceUrl, mirror) {
  const g = new THREE.SphereGeometry(1, 128, 96, phiStart, Math.PI);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    // puffy cookie: flat faces, rounded rim, slightly narrower at the tip like the photo
    p.setXYZ(i, x * W * (1 - 0.08 * y), y, Math.sign(z) * Math.pow(Math.abs(z), 0.55) * D);
  }
  g.computeVertexNormals();
  const face = tex(faceUrl);
  const mat = new THREE.MeshStandardMaterial({ map: face, bumpMap: face, bumpScale: 4, roughness: 0.9, metalness: 0 });
  mat.onBeforeCompile = (s) => {
    Object.assign(s.uniforms, { uFace: { value: face }, uSide: { value: sideTex }, uTop: { value: topTex } });
    s.vertexShader = 'varying vec3 vObjPos; varying vec3 vObjN;\n' + s.vertexShader.replace(
      '#include <begin_vertex>', '#include <begin_vertex>\nvObjPos = position; vObjN = normal;');
    s.fragmentShader = `varying vec3 vObjPos; varying vec3 vObjN;
uniform sampler2D uFace, uSide, uTop; float gH;
` + s.fragmentShader
      .replace('#include <map_fragment>', `
        vec3 q = vObjPos;
        float xu = q.x / (${W.toFixed(3)} * (1.0 - 0.08 * q.y));
        float zu = q.z / ${D.toFixed(3)};
        vec2 uvF = vec2(0.5 + ${mirror ? '-' : ''}xu * 0.47, 0.5 + q.y * 0.47);
        vec2 uvS = vec2(0.5 + zu * 0.3, 0.5 + q.y * 0.4);
        vec2 uvT = vec2(0.5 + xu * 0.42, 0.5 + zu * 0.3);
        vec3 w = pow(abs(normalize(vObjN)), vec3(3.0));
        w /= (w.x + w.y + w.z);
        vec4 c = texture2D(uFace, uvF) * w.z + texture2D(uSide, uvS) * w.x + texture2D(uTop, uvT) * w.y;
        diffuseColor *= c;
        gH = dot(c.rgb, vec3(0.299, 0.587, 0.114));`)
      // bump from the blended colour, so the rim gets relief from its own photo too
      .replace('dHdxy_fwd()', 'vec2(dFdx(gH), dFdy(gH)) * bumpScale * 0.25');
  };
  return new THREE.Mesh(g, mat);
}
const thekua = new THREE.Group();
thekua.add(half(0, 'assets/front.png', false), half(Math.PI, 'assets/back.png', true));
scene.add(thekua);

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const visH = 2 * camera.position.z * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)), visW = visH * camera.aspect;
  thekua.scale.setScalar(Math.min(visH * 0.55, visW * 0.8 / W) / 2); // ~55% of screen height
}
addEventListener('resize', resize); resize();

/* rotation: drag (with inertia) + phone tilt + idle sway */
const rot = { yaw: 0, pitch: 0, vYaw: 0, vPitch: 0 }, tilt = { x: 0, y: 0 }, cur = { x: 0, y: 0 };
let dragging = false, last = null, base = null, motionSeen = false;
const clampPitch = (v) => Math.max(-1.4, Math.min(1.4, v));
canvas.addEventListener('pointerdown', (e) => { dragging = true; last = e; canvas.setPointerCapture(e.pointerId); askMotion(); });
canvas.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  rot.vYaw = (e.clientX - last.clientX) * 0.012; rot.vPitch = (e.clientY - last.clientY) * 0.012;
  rot.yaw += rot.vYaw; rot.pitch = clampPitch(rot.pitch + rot.vPitch); last = e;
});
const endDrag = () => { dragging = false; };
canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('dblclick', () => { base = null; rot.yaw = rot.pitch = 0; }); // recenter

// iOS only gives motion after a tap; Android needs nothing.
let asked = false;
function askMotion() {
  if (asked || typeof DeviceOrientationEvent === 'undefined' || typeof DeviceOrientationEvent.requestPermission !== 'function') return;
  asked = true; DeviceOrientationEvent.requestPermission().catch(() => {});
}

addEventListener('deviceorientation', (e) => {
  if (e.gamma == null) return;
  let lr = e.gamma, fb = e.beta;
  const a = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  if (a === 90) [lr, fb] = [fb, -lr]; else if (a === 270 || a === -90) [lr, fb] = [-fb, lr];
  if (!base) base = { lr, fb };                     // the angle you hold it at = straight
  const c = (v, m) => Math.max(-m, Math.min(m, v));
  tilt.y = c(lr - base.lr, 80) * 1.8 * Math.PI / 180; // ~50° tilt shows the rim, more shows the back
  tilt.x = c(fb - base.fb, 60) * 1.2 * Math.PI / 180;
  motionSeen = true;
});

const clock = new THREE.Clock();
let intro = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if (!dragging) {                                   // inertia
    rot.yaw += rot.vYaw; rot.pitch = clampPitch(rot.pitch + rot.vPitch);
    rot.vYaw *= 0.94; rot.vPitch *= 0.94; rot.pitch *= 0.985;
  }
  intro = Math.min(1, intro + dt / 1.6);
  const e = 1 - Math.pow(1 - intro, 3);
  const sway = motionSeen ? 0 : Math.sin(t * 0.8) * 0.35;
  cur.y += (rot.yaw + tilt.y + sway - cur.y) * 0.12;
  cur.x += (rot.pitch + tilt.x - cur.x) * 0.12;
  thekua.rotation.set(cur.x, cur.y - (1 - e) * Math.PI * 2, 0);
  thekua.position.z = -3 * (1 - e);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
